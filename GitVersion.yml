mode: ContinuousDelivery
commit-message-incrementing: Enabled
tag-prefix: '^v'

major-version-bump-message: '^[a-z][a-z0-9-]*(\([^)]+\))?!:'
minor-version-bump-message: '^feat(\([^)]+\))?:'
patch-version-bump-message: '^(fix|perf)(\([^)]+\))?:'

branches:
  main:
    regex: '^main$'
    label: ''
    increment: Patch
    is-main-branch: true
  feature:
    regex: '^(feat|fix|refactor|chore|perf|docs|test|build|style|revert)[/_-](?<BranchName>.+)'
    label: '{BranchName}'
    increment: Inherit
    source-branches: [main, release]
  release:
    regex: '^rel[/_-](?<BranchName>.+)'
    label: rc
    increment: Inherit
    is-release-branch: true
    source-branches: [main]

ignore:
  paths:
    - '(?i)^src/BeatDash\.Mod/'
    - '(?i)^tests/BeatDash\.Mod\.Tests/'
    - '(?i)^GitVersion\.Mod\.yml$'
