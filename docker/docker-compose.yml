name: beatdash
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/01-init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    depends_on:
      - db
    ports:
      - 8080:8080

  rustfs:
    image: rustfs/rustfs:latest
    container_name: beatdash-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-${MINIO_ACCESS_KEY:-admin}}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-${MINIO_SECRET_KEY:-admin_pw}}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${RUSTFS_API_PORT:-${MINIO_API_PORT:-9000}}:9000"
      - "${RUSTFS_CONSOLE_PORT:-${MINIO_CONSOLE_PORT:-9001}}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s

  rustfs-init:
    image: minio/mc:latest
    container_name: beatdash-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-${MINIO_ACCESS_KEY:-admin}}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-${MINIO_SECRET_KEY:-admin_pw}}
      BUCKET_ASSETS: ${RUSTFS_BUCKET_ASSETS:-${MINIO_BUCKET_ASSETS:-beatdash-assets}}
      BUCKET_USER_DATA: ${RUSTFS_BUCKET_USER_DATA:-${MINIO_BUCKET_USER_DATA:-beatdash-user-data}}
    entrypoint: >
      /bin/sh -ec '
      mc alias set storage http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY";

      mc mb "storage/$$BUCKET_ASSETS" --ignore-existing;
      mc mb "storage/$$BUCKET_USER_DATA" --ignore-existing;
      mc anonymous set download "storage/$$BUCKET_ASSETS";
      mc anonymous set none "storage/$$BUCKET_USER_DATA";
      echo "Buckets created and policies set";
      '

volumes:
  postgres_data:
    driver: local
  rustfs_data:
    driver: local
