name: beatdash
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/01-init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    depends_on:
      - db
    ports:
      - 8080:8080

  minio:
    image: minio/minio:latest
    container_name: beatdash-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-admin_pw}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: beatdash-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin_pw}
      BUCKET_ASSETS: ${MINIO_BUCKET_ASSETS:-beatdash-assets}
      BUCKET_USER_DATA: ${MINIO_BUCKET_USER_DATA:-beatdash-user-data}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://$$MINIO_ENDPOINT:$$MINIO_PORT $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY;

      mc mb myminio/$$BUCKET_ASSETS --ignore-existing;
      mc mb myminio/$$BUCKET_USER_DATA --ignore-existing;
      mc anonymous set download myminio/$$BUCKET_ASSETS;
      mc anonymous set none myminio/$$BUCKET_USER_DATA;
      echo 'Buckets created and policies set';
      "

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
