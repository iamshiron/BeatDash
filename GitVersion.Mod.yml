mode: ContinuousDelivery
commit-message-incrementing: Enabled
tag-prefix: '^beatdash-mod/v'

major-version-bump-message: '^[a-z][a-z0-9-]*(\([^)]+\))?!:'
minor-version-bump-message: '^feat(\([^)]+\))?:'
patch-version-bump-message: '^(fix|perf)(\([^)]+\))?:'

branches:
  main:
    regex: '^main$'
    label: ''
    increment: Patch
    is-main-branch: true
  feature:
    regex: '^(feat|fix|refactor|chore|perf|docs|test|build|style|revert)[/_-](?<BranchName>.+)'
    label: '{BranchName}'
    increment: Inherit
    source-branches: [main, release]
  release:
    regex: '^rel[/_-]v?\d+\.\d+\.\d+(-(?<Label>[0-9A-Za-z-]+)(\.[0-9A-Za-z.-]+)?)?$'
    label: '{Label}'
    increment: Inherit
    is-release-branch: true
    source-branches: [main]
  # actions/checkout of a tag push is versioned as branch tags/<tag>
  tag:
    regex: '^tags[/]beatdash-mod[/]v\d+\.\d+\.\d+(-(?<Label>[0-9A-Za-z-]+)(\.[0-9A-Za-z.-]+)?)?$'
    label: '{Label}'
    increment: Inherit
    source-branches: [main, release]
    prevent-increment:
      when-current-commit-tagged: true

ignore:
  paths:
    # Only the mod, shared DTOs/libraries and shared build infrastructure affect this stream.
    - '(?i)^(?!(src/BeatDash\.(Mod|Data)/|src/Directory\.Build\.|external/|tests/BeatDash\.(Mod|Data)\.Tests/|Directory\.(Build|Packages)\.|GitVersion\.Mod\.yml$|dotnet-tools\.json$|\.github/)).+'
