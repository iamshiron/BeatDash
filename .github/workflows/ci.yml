name: CI

on:
  push:
    branches: [main]
    tags: ['v*', 'beatdash-mod/v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versioning:
    name: Release version isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet tool restore
      - run: python3 tools/versioning/test_versions.py
      - run: python3 -B tools/release/test_package.py

  backend:
    name: Backend and bundled dashboard (publish + smoke test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The Beat Saber mod (src/BeatDash.Mod) targets net472 and references the
      # proprietary game assemblies via local hint paths, so it cannot be built
      # in CI. Everything else funnels into the API and CLI entry points, whose
      # project references pull in Analysis, Beatmaps, Data and DB.
      - name: Restore
        run: |
          dotnet restore src/BeatDash.API/Shiron.BeatDash.API.csproj
          dotnet restore src/BeatDash.Cli/Shiron.BeatDash.Cli.csproj

      - name: Build (Release)
        run: |
          dotnet publish src/BeatDash.API/Shiron.BeatDash.API.csproj -c Release --no-restore -o artifacts/server
          dotnet build src/BeatDash.Cli/Shiron.BeatDash.Cli.csproj -c Release --no-restore

      - name: Smoke test the published dashboard
        env:
          BEATDASH_TEST_WEB_ROOT: ${{ github.workspace }}/artifacts/server/wwwroot
        run: >-
          dotnet test tests/BeatDash.API.Tests/Shiron.BeatDash.API.Tests.csproj
          -c Release -p:SkipWebBuild=true
          --filter FullyQualifiedName~WebClientHostingExtensionsTests
          --verbosity minimal

      - name: Upload bundled server
        uses: actions/upload-artifact@v4
        with:
          name: beatdash-server
          path: artifacts/server/
          if-no-files-found: error

      # Self-contained single-file executables; the dashboard built by the server publish is reused and embedded.
      - name: Publish desktop app
        run: |
          for rid in linux-x64 win-x64; do
            dotnet publish src/BeatDash.Desktop/Shiron.BeatDash.Desktop.csproj -c Release -r "$rid" \
              -p:SkipWebBuild=true -o "artifacts/desktop-$rid"
            test "$(ls "artifacts/desktop-$rid" | wc -l)" -eq 1
          done

      - name: Upload desktop app
        uses: actions/upload-artifact@v4
        with:
          name: beatdash-desktop
          path: |
            artifacts/desktop-linux-x64/BeatDash
            artifacts/desktop-win-x64/BeatDash.exe
          if-no-files-found: error

      - name: Generate mod assembly metadata and BSIPA manifest
        run: >-
          dotnet msbuild src/BeatDash.Mod/BeatDash.Mod.csproj -restore
          -t:GenerateGitVersionInformation,UpdateAssemblyInfo,BSMT_GenerateManifest
          -p:Configuration=Release
          -p:OutputAssemblyName=obj/Release/net472/BeatDash.Mod

      # dotnet format is the .NET lint/style gate. Run it per project so the
      # unbuildable mod is never loaded, and skip the EF Core migrations
      # (PostgreSQL and SQLite), which are generated code that does not follow the
      # editorconfig whitespace rules.
      - name: Format check
        run: |
          for proj in \
            src/BeatDash.API/Shiron.BeatDash.API.csproj \
            src/BeatDash.Analysis/Shiron.BeatDash.Analysis.csproj \
            src/BeatDash.Beatmaps/Shiron.BeatDash.Beatmaps.csproj \
            src/BeatDash.Data/Shiron.BeatDash.Data.csproj \
            src/BeatDash.DB/Shiron.BeatDash.DB.csproj \
            src/BeatDash.DB.Sqlite/Shiron.BeatDash.DB.Sqlite.csproj \
            src/BeatDash.Desktop/Shiron.BeatDash.Desktop.csproj \
            src/BeatDash.Cli/Shiron.BeatDash.Cli.csproj ; do
            echo "::group::format $proj"
            dotnet format "$proj" --verify-no-changes --exclude src/BeatDash.DB/Migrations src/BeatDash.DB.Sqlite/Migrations
            echo "::endgroup::"
          done

  web:
    name: Desktop web (typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @shiron/beatdash-web typecheck

      - name: Lint
        run: pnpm --filter @shiron/beatdash-web exec biome ci src

      - name: Test
        run: pnpm --filter @shiron/beatdash-web test

      - name: Build
        run: pnpm --filter @shiron/beatdash-web build
